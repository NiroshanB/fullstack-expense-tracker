<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <section class="card">
      <h2>Add an expense</h2>
      <form id="add-form">
        <label>Amount ($)
          <input id="amount" type="number" min="0.01" step="0.01" required placeholder="12.50">
        </label>
        <label>Category
          <select id="category"></select>
        </label>
        <label>Date
          <input id="date" type="date" required>
        </label>
        <label>Note
          <input id="note" type="text" maxlength="200" placeholder="Groceries at Save-On">
        </label>
        <button type="submit">Add expense</button>
      </form>
      <p id="form-error" class="error"></p>
    </section>

    <section class="card">
      <h2>Monthly summary</h2>
      <label>Month
        <input id="month" type="month">
      </label>
      <p id="summary-line">Loading…</p>
      <canvas id="chart" width="640" height="220"></canvas>
    </section>

    <section class="card">
      <h2>Expenses</h2>
      <label>Filter by category
        <select id="filter-category">
          <option value="">All categories</option>
        </select>
      </label>
      <table>
        <thead>
          <tr><th>Date</th><th>Category</th><th>Note</th><th class="right">Amount</th><th></th></tr>
        </thead>
        <tbody id="expense-rows"></tbody>
      </table>
      <p id="empty-note"></p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
